runtime: nodejs22
instance_class: F1

env_variables:
  NODE_ENV: 'production'

handlers:
  - url: /api/register
    script: auto

  - url: /healthz
    script: auto

  - url: /assets
    static_dir: dist/assets
    http_headers:
      Cache-Control: 'public, max-age=31536000, immutable'

  - url: /(.*\.(html|css|js|png|jpg|webp|svg|ico))$
    static_files: dist/\1
    upload: dist/.*\.(html|css|js|png|jpg|webp|svg|ico)$

  - url: /.*
    script: auto

